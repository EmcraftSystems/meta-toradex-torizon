# The download buffer, which is all this board needs beyond NXP's defconfig:
# that already brings the gadget up (USB_GADGET, USB_GADGET_DOWNLOAD, CI_UDC and
# the 1fc9:0152 pair the host enumerates) and picks the storage device itself.
#
# The target device is deliberately NOT set here. CONFIG_FASTBOOT_FLASH_MMC_DEV
# belongs to U-Boot's own fastboot, whose flash-provider choice is guarded on
# !FSL_FASTBOOT; NXP sets FSL_FASTBOOT, so that symbol cannot be selected and a
# fragment naming it is dropped without a diagnostic. NXP's implementation reads
# fastboot_devinfo.dev_id at run time instead and reports the result as
# "flash target is MMC:3" on this board.
#
# NXP's defconfig asks for a 1 GiB buffer (BUF_SIZE=0x40000000) based at
# 0x83800000. This board reports "DRAM: 1 GiB", so 0x80000000..0xC0000000, and
# that claims 56 MiB past the top. The size is what U-Boot answers to fastboot's
# `getvar max-download-size`, so a client honouring it can write past physical
# memory; uuu clamps its sparse chunks to 16 MiB regardless, which is why a
# whole-card write never reaches the overrun. 512 MiB leaves room under
# relocated U-Boot. A board with less DRAM must set both to fit: at this base
# address a 512 MB part has only ~456 MiB above it.
CONFIG_FASTBOOT_BUF_ADDR=0x83800000
CONFIG_FASTBOOT_BUF_SIZE=0x20000000
