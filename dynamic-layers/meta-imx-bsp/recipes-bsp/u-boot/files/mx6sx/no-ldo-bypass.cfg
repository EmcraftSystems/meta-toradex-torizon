# NXP's board file switches the core rails to LDO bypass, after which the
# kernel's anatop regulator cannot read a valid selector: vddarm and vddsoc
# fail to register, cpufreq gets no policy, and imx_thermal registers no
# thermal zone -- so the SoC runs unthrottled with no critical trip.
# CONFIG_LDO_BYPASS_CHECK is not set
