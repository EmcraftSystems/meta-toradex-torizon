# The three fastboot symbols that depend on this board rather than on the SoC.
# Everything else the gadget needs is in torizon-imx6-usb-gadget.cfg.

# fastboot resolves its target as blk_get_dev("mmc", CONFIG_FASTBOOT_FLASH_MMC_DEV)
# at compile time, and Kconfig defaults it only for Rockchip and Sunxi. Device 3
# is uSDHC4, the SD4 socket the boot ROM reads.
CONFIG_FASTBOOT_FLASH_MMC_DEV=3

# Buffer sized against this board's measured DRAM, not copied from NXP's 1 GiB:
# this board reports "DRAM: 1 GiB", so 0x80000000..0xC0000000, and a 1 GiB buffer
# based at 0x83800000 would run 56 MiB past the top. 512 MiB leaves ample room
# under relocated U-Boot. A board with less DRAM must set both of these to fit.
# The size is what U-Boot answers to fastboot's `getvar max-download-size`; it
# does NOT bound the sparse chunk size, which uuu clamps to 16 MiB of its own
# accord, so a whole-card write arrives as many small transactions rather than a
# few buffer-sized ones.
CONFIG_FASTBOOT_BUF_ADDR=0x83800000
CONFIG_FASTBOOT_BUF_SIZE=0x20000000
