# USB device mode, so `uuu` can write the boot medium through the board. The
# stock i.MX 6 defconfigs build USB host only, which is the opposite end of the
# cable.
#
# The symbol set is NXP's own (uboot-imx lf_v2024.04
# configs/mx6sxsabresd_defconfig), which is the strongest evidence available that
# it is right for this silicon.
#
# The VID/PID pair is not cosmetic, but it is not a magic constant either: uuu
# matches a fastboot device against a table compiled into it, and 1fc9:0152
# entered that table only in December 2021. A uuu older than that matches nothing
# here and waits forever; a script can also add the pair at run time with a
# `CFG: FB: -vid 0x1FC9 -pid 0x0152` line. Keep this pair -- it is NXP's own
# registered VID and what current uuu expects -- and require a new enough tool.
CONFIG_USB_GADGET=y
CONFIG_USB_GADGET_MANUFACTURER="FSL"
CONFIG_USB_GADGET_VENDOR_NUM=0x1fc9
CONFIG_USB_GADGET_PRODUCT_NUM=0x0152
CONFIG_CI_UDC=y
CONFIG_CMD_FASTBOOT=y
CONFIG_USB_FUNCTION_FASTBOOT=y
CONFIG_FASTBOOT_UUU_SUPPORT=y
CONFIG_FASTBOOT_FLASH=y
CONFIG_FASTBOOT_FLASH_MMC=y

# `flash all` is only a valid target name when the user-area alias is built in
# and named; without these two, fastboot_mmc_flash_write falls through to a
# partition-table lookup and rejects the request.
CONFIG_FASTBOOT_MMC_USER_SUPPORT=y
CONFIG_FASTBOOT_MMC_USER_NAME="all"

# The fastboot transfer buffer is not the only allocation a sparse write needs.
# write_sparse_chunk_raw() takes a DMA-aligned staging buffer of
# FASTBOOT_MAX_BLK_WRITE blocks -- 16384 * 512 = 8 MiB -- from U-Boot's malloc
# pool, and NXP's defconfig leaves that pool at 0x300000 (3 MiB). The allocation
# fails on the first raw chunk, the board answers "Malloc failed for:
# CHUNK_TYPE_RAW", and the write ends before any data reaches the card. The
# staging buffer is a fixed size on every board, so 16 MiB clears it with room
# for everything else U-Boot allocates regardless of how much DRAM is fitted.
CONFIG_SYS_MALLOC_LEN=0x1000000

# Fallback write paths, carried because they share the gadget and cost nothing.
# `ums` is usable as-is: it exposes the whole medium as a block device. `dfu` is
# not, quite -- it needs a dfu_alt_info describing the raw region, which nothing
# here supplies, so it fails with "Couldn't find dfu_alt_info" until one is set
# at the prompt. Both avoid fastboot's partition-name semantics.
CONFIG_CMD_USB_MASS_STORAGE=y
CONFIG_CMD_DFU=y
CONFIG_DFU_MMC=y
