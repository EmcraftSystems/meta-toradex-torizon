# The stock bootcmd fatloads the boot script from partition 1, which here is
# the OSTree ext4 root. scriptaddr rather than the loadaddr the other machines
# use, because loadaddr here is where the kernel is loaded a moment later; it
# comes from torizon-imx6sx.env. findfdt selects the revision's device tree.
CONFIG_BOOTCOMMAND="run findfdt; setenv fdtfile ${fdt_file}; setenv devtype mmc; setenv devnum ${mmcdev}; ext4load ${devtype} ${devnum}:1 ${scriptaddr} /boot.scr && source ${scriptaddr}"
