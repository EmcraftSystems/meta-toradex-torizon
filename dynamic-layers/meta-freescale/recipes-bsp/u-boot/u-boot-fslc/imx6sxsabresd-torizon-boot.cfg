# The stock bootcmd fatloads the boot script from partition 1, which in this
# machine's layout is the OSTree ext4 root, so it fails and autoboot falls
# through to netboot. ext4load reaches it where the stock ${script} already says.
#
# The setenvs supply what boot.cmd and uEnv.txt read and this board's environment
# never defined. They live here because the board keeps its environment in a C
# header macro, which a config fragment cannot reach.
#
# kernel_addr_r is the address this board's own configuration already nominates
# for loaded images. The device tree and ramdisk addresses are derived from the
# SoC map (DRAM at 0x80000000, 1 GiB measured) and the artefact sizes -- device
# tree at 48 MiB, initramfs 10.3 MiB at 56 MiB -- rather than copied from another
# board, since no in-tree i.MX6SX board uses this boot path.
#
# Revision selection is left to the board's own findfdt rather than a literal
# device-tree name, so a rev B board with a clean environment keeps imx6sx-sdb.dtb.
# Note the boot script env-saves on first boot, so a card provisioned on a rev A
# board carries that selection with it.
CONFIG_BOOTCOMMAND="run findfdt; setenv fdtfile ${fdt_file}; setenv devtype mmc; setenv devnum ${mmcdev}; setenv scriptaddr 0x80800000; setenv kernel_addr_r 0x82000000; setenv fdt_addr_r 0x83000000; setenv ramdisk_addr_r 0x83800000; mmc dev ${mmcdev}; if ext4load ${devtype} ${devnum}:1 ${scriptaddr} /boot.scr; then source ${scriptaddr}; fi"
