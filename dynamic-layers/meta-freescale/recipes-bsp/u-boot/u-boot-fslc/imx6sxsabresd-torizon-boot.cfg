# The stock bootcmd fatloads the boot script from partition 1, which here is
# the OSTree ext4 root. The load addresses come from torizon-imx6sx.env;
# findfdt selects the revision's device tree and writes fdt_file.
CONFIG_BOOTCOMMAND="run findfdt; setenv fdtfile ${fdt_file}; setenv devtype mmc; setenv devnum ${mmcdev}; mmc dev ${mmcdev}; if ext4load ${devtype} ${devnum}:1 ${scriptaddr} /boot.scr; then source ${scriptaddr}; fi"
