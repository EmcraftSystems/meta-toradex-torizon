# NETFILTER_XT_MATCH_IPVS is deliberately absent: it depends on IP_VS, which
# nothing here needs, and setting it alone is dropped without a diagnostic.
CONFIG_BLK_CGROUP=y
CONFIG_CGROUP_CPUACCT=y
CONFIG_CGROUP_SCHED=y
CONFIG_CPUSETS=y
CONFIG_BPF_SYSCALL=y
CONFIG_CGROUP_BPF=y
# Module where there is a choice: this board's U-Boot load addresses were derived
# by hand against a measured zImage, and modules do not grow it.
CONFIG_VETH=y
CONFIG_BRIDGE=m
CONFIG_BRIDGE_NETFILTER=m
CONFIG_NF_CONNTRACK=y
CONFIG_NF_NAT=m
CONFIG_IP_NF_IPTABLES=m
CONFIG_IP_NF_FILTER=m
CONFIG_IP_NF_MANGLE=m
CONFIG_IP_NF_NAT=m
CONFIG_IP_NF_TARGET_MASQUERADE=m
CONFIG_NETFILTER_XT_MARK=m
CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=m
CONFIG_NETFILTER_XT_MATCH_CONNTRACK=m
