# Boot Torizon OS from the SD card.
#
# The stock bootcmd cannot reach the boot script this machine installs. It
# fatloads ${script} from mmc ${mmcdev}:${mmcpart}, but partition 1 of the
# layout in torizon-imx6sxsabresd-sota.wks is the OSTree ext4 root, not a FAT
# boot partition, so the load fails with "Can't set block device" and autoboot
# falls through to netboot. torizon_base_image_type.inc puts boot.scr at the
# root of that filesystem, so ext4load finds it where the stock ${script} says.
#
# The rest of the command supplies what boot.cmd and uEnv.txt read and this
# board's environment has never defined: devtype/devnum for the loads, fdtfile
# (the board defines fdt_file, a different name), and the three _r addresses.
# CFG_EXTRA_ENV_SETTINGS would be their natural home, but it is a C header
# macro and unreachable from a config fragment; CONFIG_BOOTCOMMAND is a Kconfig
# string, and a bootcmd may set variables before using them.
#
# Addresses are derived from the SoC map (DRAM at 0x80000000, 1 GiB measured)
# and the artifact sizes, not copied from another board: zImage 8.9 MiB at
# 32 MiB, device tree at 48 MiB, initramfs 10.3 MiB at 56 MiB. scriptaddr is
# deliberately not loadaddr, because boot.cmd reloads uEnv.txt to ${loadaddr}
# while the script it came from is still executing.
#
# fdtfile comes from the board's own findfdt rather than a literal, so a rev B
# board is not hardcoded to the rev A tree. On rev A, board_late_init sets
# board_rev=REVA and findfdt selects imx6sx-sdb-reva.dtb.
CONFIG_BOOTCOMMAND="run findfdt; setenv fdtfile ${fdt_file}; setenv devtype mmc; setenv devnum ${mmcdev}; setenv scriptaddr 0x80800000; setenv kernel_addr_r 0x82000000; setenv fdt_addr_r 0x83000000; setenv ramdisk_addr_r 0x83800000; mmc dev ${mmcdev}; if ext4load ${devtype} ${devnum}:1 ${scriptaddr} /boot.scr; then source ${scriptaddr}; fi"
