# USB device mode for the i.MX6SoloX SABRE-SD, so `uuu` can write the SD card
# through the board. The stock defconfig builds USB host only, which is the
# opposite end of the cable.
#
# The symbol set is NXP's own for this board (uboot-imx lf_v2024.04
# configs/mx6sxsabresd_defconfig), which is the strongest evidence available that
# it is right for this silicon and this carrier. The VID/PID pair is not
# cosmetic: uuu identifies the fastboot device by exactly 1fc9:0152.
CONFIG_USB_GADGET=y
CONFIG_USB_GADGET_MANUFACTURER="FSL"
CONFIG_USB_GADGET_VENDOR_NUM=0x1fc9
CONFIG_USB_GADGET_PRODUCT_NUM=0x0152
CONFIG_CI_UDC=y
CONFIG_CMD_FASTBOOT=y
CONFIG_USB_FUNCTION_FASTBOOT=y
CONFIG_FASTBOOT_UUU_SUPPORT=y
CONFIG_FASTBOOT_FLASH=y

# NXP's config stops at FASTBOOT_FLASH, which is not enough to write the card:
# fastboot resolves its target as blk_get_dev("mmc", CONFIG_FASTBOOT_FLASH_MMC_DEV)
# at compile time, and Kconfig defaults that only for Rockchip and Sunxi. Device 3
# is uSDHC4, the SD4 socket the boot ROM reads.
CONFIG_FASTBOOT_FLASH_MMC=y
CONFIG_FASTBOOT_FLASH_MMC_DEV=3

# `flash all` is only a valid target name when the user-area alias is built in
# and named; without these two, fastboot_mmc_flash_write falls through to a
# partition-table lookup and rejects the request.
CONFIG_FASTBOOT_MMC_USER_SUPPORT=y
CONFIG_FASTBOOT_MMC_USER_NAME="all"

# Buffer sized against the board's measured DRAM, not copied from NXP's 1 GiB:
# this board reports "DRAM: 1 GiB", so 0x80000000..0xC0000000, and a 1 GiB buffer
# based at 0x83800000 would run 56 MiB past the top. 512 MiB leaves ample room
# under relocated U-Boot. This figure is also what U-Boot answers to fastboot's
# `getvar max-download-size`, so it caps the sparse chunk size too.
CONFIG_FASTBOOT_BUF_ADDR=0x83800000
CONFIG_FASTBOOT_BUF_SIZE=0x20000000

# Fallback write paths, carried because they share the gadget and cost nothing.
# `ums` is usable as-is: it exposes the whole card as a block device. `dfu` is
# not, quite -- it needs a dfu_alt_info describing the raw region, which nothing
# here supplies, so it fails with "Couldn't find dfu_alt_info" until one is set
# at the prompt. Both avoid fastboot's partition-name semantics.
CONFIG_CMD_USB_MASS_STORAGE=y
CONFIG_CMD_DFU=y
CONFIG_DFU_MMC=y
